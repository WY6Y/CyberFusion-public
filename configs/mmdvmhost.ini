# /etc/mmdvmhost — edit before deploy (see configs/README.md)
# YSF only · Pi Zero + MMDVM_HS_Hat v1.5.2 (UART)

[General]
Callsign=CHANGEME
Id=1234567
Duplex=0
RFTimeout=120
NetTimeout=120
ModeHang=10
Display=Nextion
Daemon=0

[Info]
RXFrequency=446000000
TXFrequency=446000000
Power=1
Latitude=0.0
Longitude=0.0
Height=0
Location=Your City
Description=CyberFusion YSF Hotspot
URL=

[Log]
DisplayLevel=1
FileLevel=2
FilePath=/var/log/mmdvm
FileRoot=MMDVM

[Modem]
Protocol=uart
UARTPort=/dev/serial0
UARTSpeed=115200
# v1.5.2 GPIO board: /dev/serial0 (ttyS0 on Pi Zero). USB boards: /dev/ttyUSB0
TXInvert=1
RXInvert=0
PTTInvert=0
TXDelay=100
RXOffset=0
TXOffset=0
RXLevel=50
TXLevel=50
RFLevel=100

[Transparent Data]
Enable=0
SendFrameType=0

[D-Star]
Enable=0
[DMR]
Enable=0
[System Fusion]
Enable=1
LowDeviation=0
SelfOnly=0
TXHang=4
RemoteGateway=0

[P25]
Enable=0
[NXDN]
Enable=0
[POCSAG]
Enable=0
[FM]
Enable=0

[System Fusion Network]
Enable=1
LocalAddress=127.0.0.1
LocalPort=3200
GatewayAddress=127.0.0.1
GatewayPort=4200
Debug=0

[Nextion]
Display=0
Port=/dev/ttyUSB0
Brightness=50
DisplayClock=1
UTC=0
ScreenLayout=0
IdleBrightness=20

[Remote Control]
Enable=0