# /etc/mmdvmhost for WY6Y CyberFusion on Pi Zero + v1.5.2 board
# YSF only. Edit Callsign, Frequencies, and Modem Port.

[General]
Callsign=WY6Y
Id=1234567
Duplex=0
RFTimeout=120
NetTimeout=120
ModeHang=10
Display=Nextion
Daemon=0

[Info]
RXFrequency=438800000
TXFrequency=438800000
Power=1
Latitude=35.47
Longitude=-97.52
Height=5
Location=Oklahoma City
Description=CyberFusion YSF
URL=

[Log]
DisplayLevel=1
FileLevel=2
FilePath=/var/log/mmdvm
FileRoot=MMDVM

[Modem]
Protocol=uart
UARTPort=/dev/serial0
UARTSpeed=115200
# v1.5.2 GPIO board: /dev/serial0 (symlink to ttyS0 on Pi Zero)
# USB boards often /dev/ttyUSB0
TXInvert=1
RXInvert=0
PTTInvert=0
TXDelay=100
RXOffset=0
TXOffset=0
RXLevel=50
TXLevel=50
RFLevel=100

[Transparent Data]
Enable=0
SendFrameType=0

[D-Star]
Enable=0
[DMR]
Enable=0
[System Fusion]
Enable=1
LowDeviation=0
SelfOnly=0
TXHang=4
RemoteGateway=0

[P25]
Enable=0
[NXDN]
Enable=0
[POCSAG]
Enable=0
[FM]
Enable=0

[System Fusion Network]
Enable=1
LocalAddress=127.0.0.1
LocalPort=3200
GatewayAddress=127.0.0.1
GatewayPort=4200
Debug=0

[Nextion]
Display=0
Port=/dev/ttyUSB0
# Hat 4-pin header (Pi-Star style): run scripts/enable-nextion.sh after flashing display
# ScreenLayout=0 = G4KLX layout (CyberFusion HMI in nextion/hmi/)
Brightness=50
DisplayClock=1
UTC=0
ScreenLayout=0
IdleBrightness=20

[Remote Control]
Enable=0
